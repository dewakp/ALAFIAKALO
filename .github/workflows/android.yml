name: Android CI

on:
  push:
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Gradle build + unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # google-services.json is gitignored, so every run since at least
      # 2026-09-09 died at :app:processDebugGoogleServices ("File
      # google-services.json is missing") before compiling a line or running a
      # test. The real config is used when the GOOGLE_SERVICES_JSON secret is set;
      # otherwise a placeholder shaped for com.alafia.android lets the debug build
      # and unit tests run. Unit tests never reach Firebase.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "alafia-ci-placeholder",
              "storage_bucket": "alafia-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.alafia.android" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-placeholder-not-a-real-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: Android/app/build/reports/tests
