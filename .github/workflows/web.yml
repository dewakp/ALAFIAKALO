name: Web CI

on:
  push:
    paths:
      - 'WEB/frontend/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'WEB/frontend/**'
  workflow_dispatch: {}

jobs:
  test:
    name: vitest + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: WEB/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WEB/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build (production)
        run: npm run build
        env:
          VITE_SENTRY_DSN: ''  # Not needed in CI

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: WEB/frontend/dist
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: WEB/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WEB/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No PLAYWRIGHT_BASE_URL here. Set, it told Playwright a server already
      # existed; nothing started one, and every spec died with
      # ERR_CONNECTION_REFUSED — 46 failures on 2026-09-15, and every run before
      # it. Unset, playwright.config.js builds the app and serves `vite preview`.
      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: WEB/frontend/playwright-report
          retention-days: 7
