name: Backend CI

on:
  push:
    paths:
      - 'WEB/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'WEB/backend/**'
  workflow_dispatch: {}

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        # Production is Cloud SQL Postgres 16 (CLAUDE.md §1); test against it.
        image: postgres:16
        env:
          POSTGRES_USER: alafia
          POSTGRES_PASSWORD: alafia
          POSTGRES_DB: alafia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: WEB/backend

    env:
      DATABASE_URL: postgresql+asyncpg://alafia:alafia@localhost:5432/alafia_test
      DATABASE_URL_SYNC: postgresql://alafia:alafia@localhost:5432/alafia_test
      SECRET_KEY: ci-test-secret-key-not-used-in-production-min32chars
      REDIS_URL: redis://localhost:6379/0
      DEBUG: "true"
      # The `pytest` entry point does not put the working directory on sys.path,
      # so every run since this workflow existed stopped at collection with
      # "No module named 'app'" (exit 4) and ran no test. Same order as the
      # backend-test container: the canonical ALAFIAModel source first (CLAUDE.md §4).
      PYTHONPATH: ${{ github.workspace }}/ML/src:${{ github.workspace }}/WEB/backend
      # tests/conftest.py builds its own URL from TEST_DB_*, defaulting the host to
      # the compose service name `db` — which a runner cannot resolve ("Temporary
      # failure in name resolution"). The service container listens on localhost.
      TEST_DB_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # The production image runs 3.12 (its tracebacks read python3.12).
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: WEB/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --tb=short -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: WEB/backend/.coverage
