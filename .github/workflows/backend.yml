name: Backend CI

on:
  push:
    paths:
      - 'WEB/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'WEB/backend/**'
  workflow_dispatch: {}

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alafia
          POSTGRES_PASSWORD: alafia
          POSTGRES_DB: alafia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: WEB/backend

    env:
      DATABASE_URL: postgresql+asyncpg://alafia:alafia@localhost:5432/alafia_test
      DATABASE_URL_SYNC: postgresql://alafia:alafia@localhost:5432/alafia_test
      SECRET_KEY: ci-test-secret-key-not-used-in-production-min32chars
      REDIS_URL: redis://localhost:6379/0
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: WEB/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --tb=short -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: WEB/backend/.coverage
