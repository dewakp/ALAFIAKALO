server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow photo/audio uploads (camera images, voice notes) to reach the backend.
    # nginx's 1MB default would 413 a typical camera photo before it ever proxies.
    client_max_body_size 25M;

    # Hybrid PQC access tokens (~5.3KB, ML-DSA-65 signature) ride in the
    # Authorization header — give nginx room beyond its 8k default so the header
    # (token + cookies) is never truncated/400'd.
    large_client_header_buffers 8 16k;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Proxy API + WebSocket to backend.
    # Use Docker's embedded DNS (127.0.0.11) + a variable upstream so nginx
    # RE-RESOLVES the backend's IP at request time. Without this, nginx caches
    # the backend IP at startup; recreating the backend (rebuild) gives it a new
    # IP and every /api/ call then 404/502s until the frontend is restarted.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream backend;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI endpoints (meal/exercise planner, chat) can run for minutes on CPU
        # inference — don't 504 them at nginx's 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_upstream backend;
        proxy_pass http://$ws_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Deep-link manifests must be served verbatim as JSON. Without this block the
    # SPA fallback below matches them and returns index.html with HTTP 200 and
    # Content-Type: text/html — which LOOKS healthy to a curl status check but is
    # rejected by both Apple and Google, so Universal Links / App Links silently
    # never verify. `^~` stops nginx before the regex/fallback locations.
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for all unmatched routes (incl. "/").
    # no-cache here too: the bare "/" request returns index.html but is matched by
    # THIS block (not `location = /index.html`), so without this a stale shell can
    # be cached and keep loading old chunks after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # The app shell must never be cached, otherwise a stale index.html keeps
    # referencing old hashed chunks after a deploy → failed dynamic import →
    # blank page. Hashed assets below stay immutable; index.html always revalidates.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Cache static (content-hashed) assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
