[package]
name = "alafia_crypto"
version = "0.1.0"
edition = "2021"
description = "High-performance cryptographic services for ALAFIA healthcare platform"

[lib]
name = "alafia_crypto"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
subtle = "2.5"               # constant-time comparison
