services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: alafia
      POSTGRES_PASSWORD: alafia
      POSTGRES_DB: alafia
    ports:
      - "5435:5432"
    volumes:
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data. The 18+
      # images store the cluster in a major-version subdirectory so
      # `pg_upgrade --link` is not blocked by a mount-point boundary, and they
      # refuse to start if they find data at the old path — the container exits
      # with "these Docker images are configured to store database data in a
      # format which is compatible with pg_ctlcluster" and compose reports only
      # `service "db" is not running`.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alafia"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NOTE: Ollama runs NATIVELY on the macOS host (Metal GPU + 24 GB), not in Docker.
  # The Docker Ollama was CPU-only inside a 7.7 GB VM — too small/slow for a real
  # model. The backend reaches the host daemon via host.docker.internal:11434.

  chain:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    ports:
      - "8546:8545"
    command: ["--accounts", "1", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "cast rpc eth_blockNumber --rpc-url http://localhost:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    # Source is mounted and --reload is on, so edits take effect immediately.
    # Without the mount this container serves whatever `COPY . .` baked at build
    # time: a `docker compose restart` looks like it picked up your change and
    # silently did not (new routes 404). The image is still the source of the
    # installed dependencies, including the Rust alafia_crypto wheel, which
    # lives in site-packages and is not shadowed by this mount.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8005:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://alafia:alafia@db:5432/alafia
      DATABASE_URL_SYNC: postgresql://alafia:alafia@db:5432/alafia
      CHAIN_NODE_URL: http://chain:8545
      # Shared 6IGMA Identity service (SSO via JWKS-verified RS256 JWT).
      IDENTITY_ENABLED: "true"
      IDENTITY_BASE_URL: http://identity:8000
      IDENTITY_ISSUER: 6igma-identity
      IDENTITY_AUDIENCE: alafia
      IDENTITY_MIGRATION_SECRET: ${IDENTITY_MIGRATION_SECRET:-dev-migration-secret-change-me}
      # Ollama runs NATIVELY on the macOS host (Metal GPU + full RAM). Reach it via
      # host.docker.internal; the host daemon must listen on 0.0.0.0:11434
      # (launchctl setenv OLLAMA_HOST "0.0.0.0:11434" then relaunch Ollama).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gpt-oss:20b
      # Vision (food photos) routes through a local vision model on the host.
      # llava, NOT moondream. moondream is a grounding/detection model: asked for
      # the food schema it answers with bounding boxes ({"top": [...], "size": ...})
      # and never emits `items`, so every photo failed. llava follows the schema
      # with one image and with several. Verified against both.
      OLLAMA_VISION_MODEL: llava
      OLLAMA_TIMEOUT: "300"
      FIREBASE_SERVICE_ACCOUNT: /run/secrets/firebase_sa
      # One-directional incremental Firebase→PostgreSQL sync (delta-only)
      FIREBASE_SYNC_ENABLED: "true"
      FIREBASE_SYNC_INTERVAL_SECONDS: "300"
    volumes:
      - /Users/woleakpose/Developer/LAFIAKALO/alafia-9i0hh-firebase-adminsdk-fbsvc-fb3e9a5364.json:/run/secrets/firebase_sa:ro
      # ALAFIAModel router lives in ML/src (outside the backend build context).
      # alafia_model_service.py adds /ML/src to sys.path → mount it there so the
      # LLM/AI routing actually loads instead of falling back to "unavailable".
      - /Users/woleakpose/Developer/LAFIAKALO/ML/src:/ML/src:ro
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      chain:
        condition: service_healthy
      identity:
        condition: service_started

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    command: ["python", "-m", "app.services.mcp_nutrition_server"]
    ports:
      - "8003:8003"
    environment:
      MCP_TRANSPORT: sse
      MCP_PORT: "8003"
      USDA_API_KEY: ${USDA_API_KEY:-DEMO_KEY}
      # Only needed for the get_med_nutrients tool (med→nutrient profile lookup).
      DATABASE_URL: postgresql+asyncpg://alafia:alafia@db:5432/alafia
    depends_on:
      db:
        condition: service_healthy

  # 6IGMA Shared Identity Service — PostgreSQL-native IdP for ALAFIA + FlowSheet.
  # Co-located: uses the SAME Postgres cluster, isolated in the `identity` schema.
  identity:
    build: ./identity_service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8100:8000"
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://alafia:alafia@db:5432/alafia
      IDENTITY_DB_SCHEMA: identity
      IDENTITY_ENV: ${IDENTITY_ENV:-development}
      IDENTITY_MIGRATION_SECRET: ${IDENTITY_MIGRATION_SECRET:-dev-migration-secret-change-me}
      # Persistent hybrid signing keys + HS secret (NOT baked into the image).
      # Generated by scripts/generate_keys.py; mounted read-only below.
      IDENTITY_KEYS_FILE: /run/keys/identity_keys.json
    volumes:
      - ./identity_service/keys:/run/keys:ro
    depends_on:
      db:
        condition: service_healthy

  # FlowSheet (6IGMA Health Portal) API — clinical complement to ALAFIA.
  # Co-located on ALAFIA's Postgres cluster (database `sigma_health`) and wired to
  # the SAME shared identity IdP, so one credential set works across both apps.
  flowsheet:
    build: ../../FlowSheet/src/6igma_health_backend/api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8101:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://alafia:alafia@db:5432/sigma_health
      SECRET_KEY: flowsheet-dev-secret-change-me
      ENVIRONMENT: development
      # Resend SMTP, same provider and same verified domain as ALAFIA.
      # alafia.app is the only domain verified in Resend, so it is the only
      # address we can send FROM — 6igmahealth.com would be rejected at send
      # time. The API key comes from WEB/.env (gitignored); never inline it
      # here, this file is tracked.
      MAIL_SERVER: smtp.resend.com
      MAIL_PORT: "587"
      MAIL_USERNAME: resend
      MAIL_PASSWORD: ${RESEND_API_KEY:?set RESEND_API_KEY in WEB/.env}
      MAIL_USE_TLS: "true"
      MAIL_FROM: noreply@alafia.app
      MAIL_FROM_NAME: 6IGMA Health Portal
      IDENTITY_ENABLED: "true"
      IDENTITY_BASE_URL: http://identity:8000
      IDENTITY_ISSUER: 6igma-identity
      IDENTITY_AUDIENCE: flowsheet
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_started

  # Production image: node builds dist/, nginx serves it. There is NO source
  # mounted and NO HMR — it serves whatever was baked at `docker compose build`
  # time, so it is stale until you rebuild it. For day-to-day work use
  # `frontend-dev` below.
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # ── Development / CI services ─────────────────────────────────────────────
  # All of these run under the `dev` and `test` profiles so a plain
  # `docker compose up` still brings up only the app.
  #
  # Node is pinned here (node:20-alpine, matching frontend/Dockerfile's builder
  # stage) so the toolchain cannot drift between machines the way a host nvm
  # install does.
  #
  # Each service keeps node_modules in its OWN anonymous volume — deliberately
  # not shared, because the alpine (musl) and Playwright (glibc) images cannot
  # use each other's native modules. `npm ci` runs only when that volume is
  # empty or package-lock.json is newer than the last install, so a restart is
  # seconds rather than a full reinstall.

  # Vite dev server with HMR. This is the one to use for frontend work.
  #   docker compose --profile dev up frontend-dev     → http://localhost:5173
  frontend-dev:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume so the image's installed node_modules is not shadowed
      # by the host directory (whose modules are built for a different platform).
      - /app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_POLL: "1"          # macOS bind mounts deliver no inotify events
    command: sh -c '[ -f node_modules/.install-stamp ] && [ node_modules/.install-stamp -nt package-lock.json ] || { npm ci && touch node_modules/.install-stamp; }; npm run dev'
    depends_on:
      - backend

  # Unit tests (vitest).
  #   docker compose --profile test run --rm frontend-test
  frontend-test:
    image: node:20-alpine
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c '[ -f node_modules/.install-stamp ] && [ node_modules/.install-stamp -nt package-lock.json ] || { npm ci && touch node_modules/.install-stamp; }; npx vitest run'

  # Built bundle served by `vite preview` — the target for the e2e suite.
  # Nothing compiles while tests run, which is what makes the suite deterministic.
  frontend-preview:
    image: node:20-alpine
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Same as frontend-dev: inside a container `localhost` is that container,
      # so the proxy has to name the backend SERVICE. Without this, `/api` in
      # preview mode is ECONNREFUSED and every e2e spec is forced to mock the
      # API — which is how a real client/server contract break stays invisible
      # to a green suite.
      VITE_API_PROXY_TARGET: http://backend:8000
    command: sh -c '[ -f node_modules/.install-stamp ] && [ node_modules/.install-stamp -nt package-lock.json ] || { npm ci && touch node_modules/.install-stamp; }; npm run build && npm run preview'
    healthcheck:
      # e2e waits on this rather than racing the ~15s install-and-build.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # End-to-end tests (Playwright). Uses Microsoft's image because the browsers
  # and their system libraries are already installed in it — `npx playwright
  # install` inside a bare node image pulls ~400 MB on every run.
  #
  # It runs against `frontend-preview` (a real build), NOT the dev server: vite
  # compiles each lazy route chunk on first request, and with parallel workers
  # that compile lands inside whichever spec got there first — a different test
  # failed on every cold run. Setting PLAYWRIGHT_BASE_URL also disables the
  # config's own webServer block, so no second server starts in here.
  #   docker compose --profile test run --rm e2e
  e2e:
    # The tag MUST match the @playwright/test version npm ci installs, or the
    # browser build the runner looks for is not in the image
    # ("Executable doesn't exist at /ms-playwright/chromium_headless_shell-...").
    # package.json pins @playwright/test to 1.59.1 for exactly this reason.
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend-preview:5173
    command: sh -c '[ -f node_modules/.install-stamp ] && [ node_modules/.install-stamp -nt package-lock.json ] || { npm ci && touch node_modules/.install-stamp; }; npx playwright test'
    depends_on:
      frontend-preview:
        condition: service_healthy

  # Backend tests. The backend image already carries pytest, pytest-asyncio and
  # aiosqlite (requirements.txt), so this reuses it rather than building a
  # second one. The suite uses its own SQLite database and never touches `db`.
  backend-test:
    build: ./backend
    profiles: ["test"]
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app:/ml/src
    volumes:
      - ./backend:/app
      - ../ML:/ml:ro
    command: ["pytest", "-q"]

volumes:
  pgdata:
